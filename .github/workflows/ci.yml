name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # API compatibility is measured against the latest immutable tag.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version,
          # and setup-go would install exactly that -- a patch release whose
          # standard library carries fixed vulnerabilities. "stable" is the
          # version people actually run, which is what CI should test against.
          go-version: stable

      - name: gofmt
        # Two filters, and neither is preference. gofmt is the only tool in the
        # chain that ignores build tags, so it reads files the compiler
        # deliberately excludes; testdata/ holds fixtures that are invalid on
        # purpose. `go build`, `go vet` and `go test` skip both on their own.
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # configure:template-start
      # The build tag keeps configure.go out of ./..., so nothing above has
      # looked at it. Named directly, it is checked like any other file --
      # otherwise the first person to run it is the one who finds out it does
      # not compile.
      - name: vet the configure command
        run: go vet configure.go
      # configure:template-end

      - name: test
        run: go test -race ./...

      # A v0 release may break, but every break must tell an installer exactly
      # what to replace. Module mode also sees a deleted package or type that a
      # loop over the current package list would miss.
      - name: api diff against the last release
        run: |
          set -euo pipefail
          modpath=$(GOWORK=off go list -m -f '{{.Path}}')
          latest=""
          while IFS= read -r tag; do
            tagged_module=$(git show "${tag}:go.mod" | sed -n 's/^module //p')
            if [ "$tagged_module" = "$modpath" ]; then
              latest="$tag"
              break
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)
          if [ -z "$latest" ]; then
            echo "no release to compare against yet"
            exit 0
          fi
          echo "comparing the working tree against $latest"

          tmp=$(mktemp -d)
          old="$tmp/last-release"
          git worktree add -q --detach "$old" "$latest"
          (cd "$old" && GOWORK=off go run golang.org/x/exp/cmd/apidiff@latest -m -w "$tmp/api.out" "$modpath")
          git worktree remove --force "$old"

          GOWORK=off go run golang.org/x/exp/cmd/apidiff@latest -m -incompatible "$tmp/api.out" "$modpath" > "$tmp/diff.out"
          broke=$(grep '^- ' "$tmp/diff.out" || true)
          if [ -z "$broke" ]; then
            echo "no incompatible change since $latest"
            exit 0
          fi
          while IFS= read -r line; do
            printf '    %s\n' "$line"
          done <<< "$broke"

          if git diff --quiet "$latest" -- UPGRADE.md; then
            echo
            echo "there are incompatible changes and UPGRADE.md was not touched since $latest."
            exit 1
          fi

          added=$(git diff "$latest" -- UPGRADE.md | grep '^+' || true)
          missing=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            symbol=${line#- }
            symbol=${symbol#package }
            symbol=${symbol#./}
            symbol=${symbol%%:*}
            [ -n "$symbol" ] || continue
            if ! printf '%s' "$added" | grep -qF -- "$symbol"; then
              echo "UPGRADE.md does not name $symbol"
              missing=1
            fi
          done <<< "$broke"
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "every incompatible change is named in UPGRADE.md"

      # Required by doc 24: a known vulnerability blocks the merge rather than
      # showing up in a report nobody reads.
      #
      # It is outside the template markers on purpose, so it survives configure:
      # a package cloned from here inherits the check, which is the whole reason
      # a skeleton carries CI at all.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # configure:template-start
  # The template configures cleanly, and what comes out passes the same gates.
  #
  # A skeleton that is green before configure.go runs and broken after is worse
  # than no skeleton at all: the breakage is found by its first user, in a
  # repository they have already started writing in.
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: configure a clean clone
        run: |
          git clone --no-hardlinks . "$RUNNER_TEMP/configured"
          cd "$RUNNER_TEMP/configured"
          go run ./configure.go --non-interactive \
            --module-path github.com/acme/arandu-widget \
            --module-slug widget \
            --package-name Widget \
            --author-name "Acme" \
            --author-username acme

      - name: it removed itself and left no placeholder behind
        run: |
          cd "$RUNNER_TEMP/configured"
          if [ -f configure.go ]; then
            echo "configure.go did not delete itself"
            exit 1
          fi
          if grep -rn --exclude-dir=.git \
               -e ':module_path' -e ':module_slug' -e ':package_name' \
               -e ':author_name' -e ':author_username' \
               -e 'Skeleton' -e 'skeleton' .; then
            echo "a placeholder survived the run"
            exit 1
          fi

      - name: it refuses a second run instead of corrupting the tree
        run: |
          cd "$RUNNER_TEMP/configured"
          git checkout -- configure.go
          before=$(find . -path ./.git -prune -o -type f -print | sort | xargs shasum | shasum)
          if go run ./configure.go --non-interactive \
               --module-path github.com/acme/arandu-widget \
               --module-slug widget \
               --package-name Widget \
               --author-name "Acme" \
               --author-username acme; then
            echo "it ran a second time over a configured repository"
            exit 1
          fi
          after=$(find . -path ./.git -prune -o -type f -print | sort | xargs shasum | shasum)
          if [ "$before" != "$after" ]; then
            echo "the refused run changed files anyway"
            exit 1
          fi
          rm -f configure.go

      - name: the four gates, on what came out
        run: |
          cd "$RUNNER_TEMP/configured"
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
          go build ./...
          go vet ./...
          go test -race ./...
  # configure:template-end
